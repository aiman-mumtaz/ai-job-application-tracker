spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/job_tracker
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  security:
    user:
      name: admin
      password: admin

server:
  port: 8080

app:
  resume:
    upload-dir: ./uploads/resumes
  gemini:
    enabled: false
  scheduler:
    enabled: false
